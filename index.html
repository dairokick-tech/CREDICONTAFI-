<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContaPro SUNAT</title><style>body{font-family:system-ui;max-width:850px;margin:50px auto;padding:20px;background:#f5f7fa;color:#172033}.box{background:white;padding:25px;border-radius:15px;margin:15px 0;box-shadow:0 8px 30px #0001}button{padding:12px 16px;border:0;border-radius:9px;background:#172033;color:#fff;cursor:pointer}pre{white-space:pre-wrap;background:#101827;color:#dce7f5;padding:15px;border-radius:10px}</style><body><h1>ContaPro · Integración SUNAT</h1><div class="box"><h2>Estado del backend</h2><button onclick="status()">Comprobar</button><pre id="out">Pulsa el botón.</pre></div><div class="box"><h2>Crear comprobante de prueba</h2><button onclick="crear()">Crear demo</button><pre id="out2"></pre></div><script>async function status(){out.textContent=JSON.stringify(await (await fetch('/api/sunat/status')).json(),null,2)}async function crear(){let r=await fetch('/api/comprobantes/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({total:118})});out2.textContent=JSON.stringify(await r.json(),null,2)}</script></body></html>
